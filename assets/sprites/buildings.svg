<svg xmlns="http://www.w3.org/2000/svg" width="192" height="32" viewBox="0 0 192 32">
  <!-- 0: Stone-Age Hut (0..32) -->
  <g transform="translate(0,0)">
    <ellipse cx="16" cy="26" rx="11" ry="3.5" fill="rgba(0,0,0,0.25)"/>
    <path d="M6,25 L16,7 L26,25 Z" fill="#c29456" stroke="#7c5628" stroke-width="1.2"/>
    <path d="M13,25 V18 Q16,15 19,18 V25 Z" fill="#3d2817"/>
  </g>
  <!-- 1: Timber House (32..64) -->
  <g transform="translate(32,0)">
    <rect x="6" y="14" width="20" height="12" fill="#d4b483" stroke="#6b4b2a" stroke-width="1.2"/>
    <polygon points="4,15 16,5 28,15" fill="#a8432b" stroke="#612214" stroke-width="1.2"/>
    <rect x="13.5" y="19" width="5" height="7" fill="#4f331c"/>
    <rect x="8.5" y="17" width="3.5" height="3.5" fill="#fef08a"/>
    <rect x="20" y="17" width="3.5" height="3.5" fill="#fef08a"/>
  </g>
  <!-- 2: Stone / Metal-Age Manor (64..96) -->
  <g transform="translate(64,0)">
    <rect x="5" y="12" width="22" height="14" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/>
    <polygon points="3,13 16,4 29,13" fill="#334155" stroke="#0f172a" stroke-width="1.2"/>
    <rect x="21" y="5" width="3.5" height="6" fill="#64748b"/>
    <rect x="13" y="19" width="6" height="7" fill="#334155"/>
    <rect x="8" y="15" width="3.5" height="4" fill="#fde047"/>
    <rect x="20.5" y="15" width="3.5" height="4" fill="#fde047"/>
  </g>
  <!-- 3: Farm Plot (96..128) -->
  <g transform="translate(96,0)">
    <rect x="3" y="5" width="26" height="22" rx="2" fill="#8b6239" stroke="#5c3f21" stroke-width="1"/>
    <line x1="6" y1="9" x2="26" y2="9" stroke="#eab308" stroke-width="2.5" stroke-dasharray="3,2"/>
    <line x1="6" y1="14" x2="26" y2="14" stroke="#84cc16" stroke-width="2.5" stroke-dasharray="3,2"/>
    <line x1="6" y1="19" x2="26" y2="19" stroke="#eab308" stroke-width="2.5" stroke-dasharray="3,2"/>
    <line x1="6" y1="24" x2="26" y2="24" stroke="#84cc16" stroke-width="2.5" stroke-dasharray="3,2"/>
  </g>
  <!-- 4: Market Stall (128..160) -->
  <g transform="translate(128,0)">
    <rect x="5" y="17" width="22" height="9" fill="#92400e" stroke="#451a03" stroke-width="1"/>
    <rect x="4" y="9" width="24" height="8" rx="1" fill="#ef4444"/>
    <rect x="8" y="9" width="4" height="8" fill="#fef3c7"/>
    <rect x="16" y="9" width="4" height="8" fill="#fef3c7"/>
    <rect x="24" y="9" width="4" height="8" fill="#fef3c7"/>
  </g>
  <!-- 5: Wooden Dock (160..192) -->
  <g transform="translate(160,0)">
    <rect x="4" y="10" width="24" height="12" fill="#9a6b3e" stroke="#5c3d1e" stroke-width="1"/>
    <line x1="8" y1="10" x2="8" y2="22" stroke="#5c3d1e" stroke-width="1"/>
    <line x1="14" y1="10" x2="14" y2="22" stroke="#5c3d1e" stroke-width="1"/>
    <line x1="20" y1="10" x2="20" y2="22" stroke="#5c3d1e" stroke-width="1"/>
    <circle cx="6" cy="12" r="2" fill="#452c16"/>
    <circle cx="26" cy="12" r="2" fill="#452c16"/>
    <circle cx="6" cy="20" r="2" fill="#452c16"/>
    <circle cx="26" cy="20" r="2" fill="#452c16"/>
