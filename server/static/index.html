<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Society</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Virtual Society</h1>
      <span id="brain-badge" class="badge">Brain: Rule-based</span>
    </div>
    <div id="clock-status" class="status" aria-live="polite">Loading world...</div>
  </header>

  <main class="layout">
    <section class="stage" aria-label="World map">
      <div class="canvas-wrap">
        <canvas id="world-canvas" width="800" height="800"></canvas>
      </div>
      <div id="pop-bar" class="pop-bar"></div>
    </section>

    <aside class="sidebar" aria-label="Controls and inspector">
      <section class="card">
        <h2>Controls</h2>
        <div class="btn-row">
          <button id="btn-play" type="button">Play</button>
          <button id="btn-step" type="button">Step</button>
        </div>
        <label class="slider-row" for="speed-slider">
          <span>Speed: <strong id="speed-val">1.0</strong> t/s</span>
          <input id="speed-slider" type="range" min="0.5" max="10" step="0.5" value="1" />
        </label>
        <div class="btn-row">
          <button id="btn-save" type="button">Save</button>
          <button id="btn-load" type="button">Load</button>
          <button id="btn-reset" type="button">New World</button>
        </div>
        <div id="toast" class="toast" aria-live="polite"></div>
      </section>

      <section class="card">
        <h2>People</h2>
        <ul id="people-list" class="people-list"></ul>
      </section>

      <section class="card">
        <h2>Inspector</h2>
        <div id="inspector" class="inspector">Select a villager to inspect.</div>
      </section>

      <section class="card">
        <h2>Live Events</h2>
        <ul id="event-feed" class="event-feed"></ul>
      </section>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
